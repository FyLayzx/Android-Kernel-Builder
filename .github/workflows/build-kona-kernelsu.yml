name: "Build kona kernel (ReSukiSU)"

# kona (OPPO sm8250 / 4.19.160) 内核自动编译
# 配方 = 2026-10 实测「可开机 + KernelSU 生效」的那一套
#
# 为什么这样写（每条都是实测踩出来的，改动前先读）：
#   1) KSU 用 ReSukiSU/BakaSU：KernelSU 官方早已不支持 non-GKI(4.19)
#   2) 必须 CONFIG_KSU_MANUAL_HOOK=y：TRACEPOINT_HOOK(自动钩子) 在 non-GKI 上会被 Kbuild 直接拒绝
#   3) 不用 `make <defconfig名>`：本树上 kbuild 的 defconfig 目标解析不可靠
#      → 直接铺成 out/.config，再跑 olddefconfig
#   4) 必须 CROSS_COMPILE=aarch64-linux-gnu-：否则 ZyC 的 clang 会按 x86_64 主机编译
#   5) 工具链 ZyC clang 11.1.0 整包（内含 LLD 11.1.0 + binutils 2.39.50），与内核作者一致；
#      该包解压后【没有顶层目录】，bin/ 直接落在解压目录下

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核仓库"
        type: string
        default: "https://github.com/FyLayzx/android_kernel_OPPO_sm8250.git"
      kernel_branch:
        description: "分支"
        type: string
        default: "stock/13.1"
      defconfig:
        description: "arch/arm64/configs/ 下的配置文件名"
        type: string
        default: "kona-resukisu-defconfig"

env:
  KERNEL_REPO: ${{ inputs.kernel_repo }}
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
  DEFCONFIG: ${{ inputs.defconfig }}
  ZYC_URL: "https://github.com/ZyCromerZ/Clang/releases/download/11.1.0-20220724-release/Clang-11.1.0-20220724.tar.gz"
  KBUILD_BUILD_USER: "FyLayzx"
  KBUILD_BUILD_HOST: "kona-ci"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: "1) 安装依赖"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev \
            libelf-dev zip unzip curl wget git python3 cpio rsync

      - name: "2) 拉取内核源码"
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          echo "HEAD: $(git rev-parse --short HEAD)  $(git log -1 --format=%s | cut -c1-60)"
          echo "KERNEL_HEAD=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: "3) 拉取 ReSukiSU/BakaSU 并接线"
        run: |
          cd kernel
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          echo "KSU: $(cd KernelSU && git log -1 --format='%h %s' | cut -c1-70)"
          # BakaSU 要求 KernelSU/.git 与其 kernel/ 同级存在
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -ld drivers/kernelsu

      - name: "4) 获取工具链 ZyC clang 11.1.0"
        run: |
          mkdir -p tc/zyc && cd tc/zyc
          curl -fL --retry 3 -o zyc.tar.gz "$ZYC_URL"
          ls -l zyc.tar.gz
          # 该压缩包没有顶层目录，直接解压即得到 bin/ lib/ ...
          tar -xzf zyc.tar.gz
          rm -f zyc.tar.gz
          echo "clang : $(./bin/clang --version | head -1)"
          echo "lld   : $(./bin/ld.lld --version | head -1)"
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: "5) 铺配置并 olddefconfig"
        run: |
          cd kernel
          CFG="arch/arm64/configs/${DEFCONFIG}"
          test -f "$CFG" || { echo "!! 找不到 $CFG"; ls arch/arm64/configs/; exit 1; }
          mkdir -p out
          cp -f "$CFG" out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig
          echo "--- 关键配置 ---"
          grep -E "^CONFIG_(KSU=|KSU_MANUAL_HOOK|RELR|LOCALVERSION|QCA_CLD_WLAN|QCA_CLD_WLAN_PROFILE)" out/.config

      - name: "6) 编译 Image.gz"
        run: |
          cd kernel
          # 编译者标识（内核 banner 里显示为 FyLayzx@kona-ci）
          export KBUILD_BUILD_USER=FyLayzx
          export KBUILD_BUILD_HOST=kona-ci
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)" Image.gz 2>&1 | tee ../build.log
          IMG=out/arch/arm64/boot/Image.gz
          ls -l "$IMG"
          echo "banner: $(zcat $IMG | strings | grep -m1 'Linux version')"

      - name: "7) 打包 AnyKernel3（可直接刷）"
        run: |
          cp -f kernel/out/arch/arm64/boot/Image.gz anykernel-kona/Image.gz
          cd anykernel-kona
          ZIP="kona-ResuKSU-${KERNEL_HEAD}-$(date +%Y%m%d-%H%M).zip"
          rm -f *.zip
          zip -qr "$ZIP" .
          ls -l "$ZIP"; md5sum "$ZIP"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV
          mkdir -p ../artifact && cp -f "$ZIP" ../artifact/

      - name: "8) 上传产物"
        uses: actions/upload-artifact@v4
        with:
          name: kona-ResuKSU-${{ env.KERNEL_HEAD }}
          path: artifact/*.zip
          if-no-files-found: erro
          retention-days: 30

      - name: "9) 失败时上传编译日志"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.KERNEL_HEAD }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
